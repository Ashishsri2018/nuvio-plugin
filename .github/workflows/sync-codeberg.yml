name: Sync from Codeberg

on:
  schedule:
    # Every 24 hours (03:00 UTC).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-codeberg
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM_URL: https://codeberg.org/eclipsia/nuvio-plugin.git
      SYNC_BRANCH: pages
      WORKFLOW_PATH: .github/workflows/sync-codeberg.yml
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          ref: pages
          persist-credentials: false

      - name: Mirror upstream branches
        shell: bash
        run: |
          set -euo pipefail

          git clone --quiet "$UPSTREAM_URL" upstream
          cd upstream
          git branch main origin/main
          git checkout --quiet "$SYNC_BRANCH"

          # Re-inject this workflow so the daily force-push of upstream pages
          # does not delete it. The commit is deterministic (fixed identity,
          # parent commit date, and message), so it is a no-op while upstream
          # is unchanged.
          mkdir -p "$(dirname "$WORKFLOW_PATH")"
          cp "$GITHUB_WORKSPACE/$WORKFLOW_PATH" "$WORKFLOW_PATH"
          git add "$WORKFLOW_PATH"
          if ! git diff --cached --quiet; then
            parent_date="$(git log -1 --format=%cI)"
            GIT_AUTHOR_DATE="$parent_date" GIT_COMMITTER_DATE="$parent_date" \
              git commit --quiet -m "chore: keep sync workflow"
          fi

          # Codeberg serves a SHA-256 repository; GitHub only accepts SHA-1.
          # Rebuild the history as SHA-1 with fast-export/fast-import.
          mirror="$(mktemp -d)"
          git init --quiet --object-format=sha1 "$mirror"
          git fast-export --branches --tags | git -C "$mirror" fast-import --quiet

          declare -a refspecs=()
          while IFS= read -r ref; do
            branch="${ref#refs/heads/}"
            refspecs+=("$ref:refs/heads/$branch")
          done < <(git -C "$mirror" for-each-ref --format='%(refname)' refs/heads)

          if [ "${#refspecs[@]}" -eq 0 ]; then
            echo "No branches imported" >&2
            exit 1
          fi

          git -C "$mirror" push --force --tags \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${refspecs[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
